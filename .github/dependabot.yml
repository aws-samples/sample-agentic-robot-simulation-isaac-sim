# Dependency update PRs for every ecosystem this repository pins (threat model T31, T32).
# Public AWS sample repositories are expected to stay clear of open Dependabot security
# alerts, so updates are grouped per ecosystem to keep the PR count reviewable.
#
# The Python lock files (agent/, hud/ and tests/requirements*.lock) are generated by
# `uv pip compile --generate-hashes` with the command recorded in each file's header;
# regenerate them together, and THIRD-PARTY-LICENSES with them, when an update lands.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /agent
      - /hud
      - /tests
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /agent
      - /hud
    schedule:
      interval: weekly
